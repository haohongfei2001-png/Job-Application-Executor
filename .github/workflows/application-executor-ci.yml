name: Application Executor CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Deterministic task, privacy and no-submit contract
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr01_contract.py tests/test_jcr01_privacy.py -k 'not city_select'
      - name: Targeted independent review browser oracle
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr07_review_certificate.py tests/test_application_v1.py tests/test_jcr01_synthetic_oracle.py tests/test_jcr06_react_fixture.py tests/test_jcr06_vue_fixture.py
      - name: Validate update-state privacy readback
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_local_operations_v1.py -k update_state_readback
      - name: Compile Python sources
        run: python -m compileall -q executor tests
      - name: Check local dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          import subprocess

          source = Path("executor/autonomy/dashboard.py").read_text(encoding="utf-8")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          with NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as handle:
              handle.write(script)
              handle.flush()
              subprocess.run(["node", "--check", handle.name], check=True)
          PY
      - name: Diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  macos_consumer_release:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Hosted Mac candidate, activation and rollback tests
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_release_candidate_v1.py tests/test_consumer_entry_v1.py

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Full round-closure test suite
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q executor tests
