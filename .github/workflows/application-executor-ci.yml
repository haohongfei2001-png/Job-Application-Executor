name: Application Executor CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Deterministic task, privacy and no-submit contract
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr01_contract.py tests/test_jcr01_privacy.py -k 'not city_select'
      - name: Targeted independent review browser oracle
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr07_review_certificate.py tests/test_application_v1.py tests/test_jcr01_synthetic_oracle.py tests/test_jcr06_react_fixture.py tests/test_jcr06_vue_fixture.py tests/test_jcr06_forms.py tests/test_generic_browser_v1.py
      - name: Validate update-state privacy readback
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_local_operations_v1.py tests/test_dashboard_diagnostics_browser.py -k 'update_state_readback or diagnostics_need_explicit_copy or diagnostics_are_copy_safe or diagnostic_repository_state_redacts or packaged_app_never_invokes_legacy_git_updater'
      - name: Prepare digest-pinned standalone Python
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Targeted packaged release and task journal
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_release_candidate_v1.py tests/test_task_state_compatibility_v1.py tests/test_consumer_entry_v1.py tests/test_standalone_runtime_v1.py tests/test_app_distribution_v1.py
      - name: Compile Python sources
        run: python -m compileall -q executor tests
      - name: Check local dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          import subprocess

          source = Path("executor/autonomy/dashboard.py").read_text(encoding="utf-8")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          with NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as handle:
              handle.write(script)
              handle.flush()
              subprocess.run(["node", "--check", handle.name], check=True)
          PY
      - name: Diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  macos_consumer_release:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare digest-pinned standalone Python
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Hosted Mac candidate, activation and rollback tests
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_release_candidate_v1.py tests/test_consumer_entry_v1.py tests/test_task_state_compatibility_v1.py tests/test_standalone_runtime_v1.py tests/test_app_distribution_v1.py

      - name: Build unsigned standalone Mac app at round boundary
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python scripts/build_macos_app.py --standalone-runtime "$JAE_STANDALONE_RUNTIME" --output "$RUNNER_TEMP/jae-unsigned-distribution"
      - name: Retain unsigned engineering artifact
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        uses: actions/upload-artifact@v4
        with:
          name: jae-unsigned-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jae-unsigned-distribution/AIApplicationManager-unsigned.tar.gz
            ${{ runner.temp }}/jae-unsigned-distribution/distribution-manifest.json
          if-no-files-found: error
          retention-days: 7

  test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare digest-pinned standalone Python
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Full round-closure test suite
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q executor tests
