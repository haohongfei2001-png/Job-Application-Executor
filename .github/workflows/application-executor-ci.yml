name: Application Executor CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qiyunfang_human_channel_smoke:
    # Early diagnosis only for the bounded channel candidate. Complete existing
    # preparation and aggregate gates remain mandatory and unchanged below.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.head_ref == 'fix/qiyunfang-human-channel' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned native test prerequisites
        run: |
          python -m pip install -r requirements.txt
          if [ ! -f '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            python -m playwright install chrome
          fi
      - name: Complete synthetic native image and human-confirmation journey
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q -s 'tests/test_preparation_human_review_browser.py::test_private_human_review_exact_request_or_zero_and_closed_owner[accept]'

  preparation_validation:
    if: github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    # Full ownership + network + lifecycle suite exceeded the former 12m job
    # budget in run 36902633259. Preserve every case; bound this full lane at 25m.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify focused workflow scope
        run: |
          python3 -m unittest discover -s tests -p test_preparation_research_workflow_v1.py
          python3 -m unittest discover -s tests -p test_engineering_closure_workflow_v1.py
      - name: Install pinned preparation test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install official headed Chrome target on hosted Mac
        if: runner.os == 'macOS'
        run: |
          if [ ! -f '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            python -m playwright install chrome
          fi
          test -f '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Observe public Qiyunfang preflight without applicant data
        timeout-minutes: 2
        run: python scripts/probe_qiyunfang_preflight.py --output "$RUNNER_TEMP/jae-qiyunfang-public-preflight.json"
      - name: Retain value-free public preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jae-qiyunfang-public-preflight-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jae-qiyunfang-public-preflight.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Isolated preparation ownership and transport oracles
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
          JAE_UI_SCREENSHOT_DIR: ${{ runner.temp }}/jae-preparation-ui
        run: python -m pytest -q -s tests/test_qiyunfang_preparation_v1.py tests/test_preparation_review_v1.py tests/test_preparation_authority_v1.py tests/test_preparation_final_journal_v1.py tests/test_preparation_process_identity_v1.py tests/test_preparation_public_reads_v1.py tests/test_preparation_discovery_v1.py tests/test_preparation_preflight_v1.py tests/test_preparation_authority_browser.py tests/test_preparation_process_identity_browser.py tests/test_preparation_flow_v1.py tests/test_preparation_flow_browser.py tests/test_preparation_resume_material_v1.py tests/test_preparation_resume_journal_v1.py tests/test_preparation_resume_transport_v1.py tests/test_preparation_resume_flow_v1.py tests/test_preparation_resume_browser.py tests/test_preparation_controller_v1.py tests/test_preparation_private_child_v1.py tests/test_preparation_private_child_browser.py tests/test_preparation_session_v1.py tests/test_preparation_session_browser.py tests/test_preparation_review_browser.py tests/test_qiyunfang_preparation_browser.py tests/test_preparation_human_request_v1.py tests/test_preparation_human_request_browser.py tests/test_preparation_human_review_v1.py tests/test_preparation_captcha_image_v1.py tests/test_preparation_human_review_browser.py tests/test_preparation_network_fence_v1.py tests/test_preparation_network_fence_browser.py tests/test_preparation_lifecycle_browser.py tests/test_preparation_native_surface_v1.py tests/test_preparation_native_surface_browser.py tests/test_preparation_native_runtime_browser.py tests/test_preparation_native_selfcheck_v1.py tests/test_preparation_change_epoch_v1.py tests/test_preparation_change_epoch_browser.py tests/test_preparation_request_classifier_v1.py tests/test_preparation_request_classifier_browser.py tests/test_preparation_classified_native_browser.py
      - name: Preserve private review synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jae-private-review-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jae-preparation-ui/preparation-private-review.png
            ${{ runner.temp }}/jae-preparation-ui/preparation-site-check.png
            ${{ runner.temp }}/jae-preparation-ui/preparation-native-*.png
          if-no-files-found: ignore
          retention-days: 3

  foundation:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact-head engineering closure routing
        run: python3 -m unittest discover -s tests -p test_engineering_closure_workflow_v1.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Deterministic task, privacy and no-submit contract
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr01_contract.py tests/test_jcr01_privacy.py -k 'not city_select'
      - name: Deterministic JCR09 state-sequence oracle
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr09_state_sequences.py
      - name: Targeted independent review browser oracle
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr07_review_certificate.py tests/test_application_v1.py tests/test_jcr01_synthetic_oracle.py tests/test_jcr06_react_fixture.py tests/test_jcr06_vue_fixture.py tests/test_jcr06_forms.py tests/test_generic_browser_v1.py tests/test_field_action_journal_v1.py tests/test_jcr06_row_recovery.py
      - name: Validate update-state privacy readback
        id: local_ui_verification
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
          JAE_UI_SCREENSHOT_DIR: ${{ runner.temp }}/jae-preparation-ui
        run: |
          python -m pytest -q tests/test_local_operations_v1.py tests/test_task_view_context_v1.py tests/test_native_window_ownership_v1.py tests/test_service_lifecycle_v1.py tests/test_profile_import_v1.py tests/test_profile_editor_v1.py tests/test_task_preparation_v1.py tests/test_manager_v1.py tests/test_jcr03_discovery.py
          python -m pytest -q tests/test_dashboard_diagnostics_browser.py -k 'diagnostics_need_explicit_copy or expired_session or task_workspace'
      - name: Complete partial lifecycle-soak runner contract
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_lifecycle_soak_runner.py
      - name: Compile Python sources
        run: python -m compileall -q executor tests
      - name: Check local dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          import subprocess

          source = Path("executor/autonomy/dashboard.py").read_text(encoding="utf-8")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          with NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as handle:
              handle.write(script)
              handle.flush()
              subprocess.run(["node", "--check", handle.name], check=True)
          PY
      - name: Diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Retain synthetic local-preparation UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jae-local-preparation-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jae-preparation-ui/preparation-dialog.png
            ${{ runner.temp }}/jae-preparation-ui/profile-editor-dialog.png
            ${{ runner.temp }}/jae-preparation-ui/profile-editor-resume.png
          if-no-files-found: error
          retention-days: 3

  packaged_candidate:
    if: github.event.action != 'labeled' && github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Preserve all owning files once across independent complete-suite shards.
    # The foundation safety/browser checks and all hosted-Mac shards remain.
    strategy:
      fail-fast: false
      matrix:
        suite: [consumer_transactions, recovery_transactions, release_distribution]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies and hosted headless UI oracle
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare digest-pinned standalone Python
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Targeted packaged release and task journal
        timeout-minutes: 12
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
          JAE_PACKAGED_SUITE: ${{ matrix.suite }}
          JAE_EVENT_ACTION: ${{ github.event.action }}
          JAE_PREVIOUS_HEAD: ${{ github.event.before }}
          JAE_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          full = [
              "tests/test_release_candidate_v1.py", "tests/test_task_state_compatibility_v1.py",
              "tests/test_consumer_entry_v1.py", "tests/test_standalone_runtime_v1.py",
              "tests/test_consumer_recovery_transactions_v1.py",
              "tests/test_app_distribution_v1.py", "tests/test_macos_host_v1.py",
          ]
          previous = os.environ.get("JAE_PREVIOUS_HEAD", "")
          head = os.environ.get("JAE_CANDIDATE_HEAD", "")
          changed = []
          if (os.environ.get("JAE_EVENT_ACTION") == "synchronize"
                  and re.fullmatch(r"[0-9a-f]{40}", previous)
                  and re.fullmatch(r"[0-9a-f]{40}", head) and previous != head):
              try:
                  subprocess.run(["git", "merge-base", "--is-ancestor", previous, head],
                                 check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  changed = subprocess.run(
                      ["git", "diff", "--name-only", "-z", previous, head],
                      check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  ).stdout.decode("utf-8").split("\0")
                  changed = [path for path in changed if path]
              except (OSError, ValueError, UnicodeError, subprocess.CalledProcessError):
                  changed = []
          allowed = {
              "executor/autonomy/consumer.py", "tests/test_consumer_entry_v1.py",
              "docs/consumer-readiness-v1/STATUS.json",
              "docs/consumer-readiness-v1/06_EXECUTION_PROTOCOL.md",
              ".github/workflows/application-executor-ci.yml",
          }
          affected = ({"executor/autonomy/consumer.py", "tests/test_consumer_entry_v1.py"}
                      <= set(changed) and set(changed) <= allowed)
          # Complete owning files, never name-filtered cases or smaller fixtures.
          # All complete hosted-Mac shards and the final complete test gate remain.
          selected = [path for path in full if path not in {
              "tests/test_standalone_runtime_v1.py", "tests/test_macos_host_v1.py",
          }] if affected else full
          consumer = {"tests/test_consumer_entry_v1.py", "tests/test_task_state_compatibility_v1.py"}
          recovery = {"tests/test_consumer_recovery_transactions_v1.py"}
          suite = os.environ["JAE_PACKAGED_SUITE"]
          partitions = {
              "consumer_transactions": [path for path in selected if path in consumer],
              "recovery_transactions": [path for path in selected if path in recovery],
              "release_distribution": [path for path in selected if path not in consumer | recovery],
          }
          covered = [path for paths in partitions.values() for path in paths]
          if len(covered) != len(set(covered)) or set(covered) != set(selected):
              raise ValueError("incomplete or duplicated complete-file partition")
          if suite not in partitions:
              raise ValueError("unknown packaged suite")
          selected = partitions[suite]
          if not selected:
              raise ValueError("empty packaged suite")
          print(json.dumps({"scope": "affected complete app transaction/release/journal/distribution files"
                            if affected else "complete original packaged Draft files",
                            "changed": changed, "full_certification": False}), flush=True)
          raise SystemExit(subprocess.run(
              [sys.executable, "-m", "pytest", "-vv", "--durations=15", *selected],
          ).returncode)
          PY


  macos_consumer_release:
    if: github.event.action != 'labeled'
    runs-on: macos-latest
    timeout-minutes: 25
    # Every original hosted-Mac file still runs exactly once. Independent
    # transaction, runtime/distribution and native UI suites keep complete fixtures
    # within the existing job budget; one shard failure cannot skip the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: consumer_transactions
            tests: tests/test_consumer_entry_v1.py tests/test_task_state_compatibility_v1.py
          - suite: recovery_transactions
            tests: tests/test_consumer_recovery_transactions_v1.py
          - suite: runtime_distribution
            tests: tests/test_release_candidate_v1.py tests/test_standalone_runtime_v1.py tests/test_app_distribution_v1.py
          - suite: native_integration
            tests: tests/test_macos_host_v1.py tests/test_task_view_context_v1.py tests/test_native_window_ownership_v1.py tests/test_jcr01_synthetic_oracle.py tests/test_jcr06_react_fixture.py tests/test_jcr06_vue_fixture.py tests/test_service_lifecycle_v1.py tests/test_profile_import_v1.py tests/test_profile_editor_v1.py tests/test_task_preparation_v1.py tests/test_manager_v1.py tests/test_jcr03_discovery.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies and hosted headless UI oracle
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare digest-pinned standalone Python
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Hosted Mac candidate, activation and rollback tests
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -v --durations=15 ${{ matrix.tests }}

      - name: Complete partial lifecycle-soak runner contract on hosted Mac
        if: matrix.suite == 'runtime_distribution'
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_lifecycle_soak_runner.py
      - name: Hosted Mac retired updater public and CLI entrypoints
        if: matrix.suite == 'native_integration'
        run: python -m pytest -q tests/test_local_operations_v1.py -k 'retired_public_updater_entries or retired_module_cli or retired_cli_never'

      - name: Build unsigned standalone Mac app at round boundary
        if: (github.event_name == 'push' || github.event.pull_request.draft == false) && matrix.suite == 'native_integration'
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python scripts/build_macos_app.py --standalone-runtime "$JAE_STANDALONE_RUNTIME" --output "$RUNNER_TEMP/jae-unsigned-distribution"
      - name: Retain unsigned engineering artifact
        if: (github.event_name == 'push' || github.event.pull_request.draft == false) && matrix.suite == 'native_integration'
        uses: actions/upload-artifact@v4
        with:
          name: jae-unsigned-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jae-unsigned-distribution/AIApplicationManager-unsigned.tar.gz
            ${{ runner.temp }}/jae-unsigned-distribution/distribution-manifest.json
          if-no-files-found: error
          retention-days: 7

  test:
    if: (github.event.action != 'labeled' && (github.event_name == 'push' || github.event.pull_request.draft == false)) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == format('eng-{0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      closure_head: ${{ steps.closure_head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.action == 'labeled' && github.event.pull_request.head.sha || '' }}
      - name: Refuse stale or ineligible engineering closure head
        id: closure_head
        if: github.event.action == 'labeled'
        env:
          JAE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess

          # Isolated stdlib only: never import code from the checked-out candidate.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          head = event["pull_request"]["head"]
          sha = head["sha"]
          if (os.environ["GITHUB_EVENT_NAME"] != "pull_request"
                  or event["action"] != "labeled"
                  or head["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"]
                  or not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or event["label"]["name"] != "eng-" + sha
                  or os.environ["JAE_EXPECTED_HEAD"] != sha):
              raise SystemExit("ineligible exact-head engineering closure")

          def git(*args):
              return subprocess.run(["git", *args], check=True, text=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                    timeout=60).stdout.strip()

          # A label event can become stale while the runner is queued. Refuse before
          # setup, dependency installation, tests or builds if its branch has moved.
          full_ref = "refs/heads/" + head["ref"]
          git("check-ref-format", full_ref)
          if (git("rev-parse", "--verify", "HEAD") != sha
                  or git("ls-remote", "--exit-code", "--refs", "origin", full_ref)
                  != sha + "\t" + full_ref):
              raise SystemExit("engineering closure head changed; no repository code executed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("sha=" + sha + "\n")
          print("Exact-head engineering closure admitted; NOT_CERTIFIED")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare digest-pinned standalone Python
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Full round-closure test suite
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -v
      - name: Compile Python sources
        run: python -m compileall -q executor tests

  engineering_closure_macos:
    # One unsigned build only after the unchanged complete Linux suite succeeds.
    # This is engineering evidence; Draft status and certification stay unchanged.
    needs: test
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == format('eng-{0}', github.event.pull_request.head.sha) && needs.test.result == 'success' && needs.test.outputs.closure_head == github.event.pull_request.head.sha
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.closure_head }}
      - name: Refuse stale or ineligible engineering closure head
        id: closure_head
        env:
          JAE_EXPECTED_HEAD: ${{ needs.test.outputs.closure_head }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess

          # Isolated stdlib only: never import code from the checked-out candidate.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          head = event["pull_request"]["head"]
          sha = head["sha"]
          if (os.environ["GITHUB_EVENT_NAME"] != "pull_request"
                  or event["action"] != "labeled"
                  or head["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"]
                  or not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or event["label"]["name"] != "eng-" + sha
                  or os.environ["JAE_EXPECTED_HEAD"] != sha):
              raise SystemExit("ineligible exact-head engineering closure")

          def git(*args):
              return subprocess.run(["git", *args], check=True, text=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                    timeout=60).stdout.strip()

          # A label event can become stale while the runner is queued. Refuse before
          # setup, dependency installation, tests or builds if its branch has moved.
          full_ref = "refs/heads/" + head["ref"]
          git("check-ref-format", full_ref)
          if (git("rev-parse", "--verify", "HEAD") != sha
                  or git("ls-remote", "--exit-code", "--refs", "origin", full_ref)
                  != sha + "\t" + full_ref):
              raise SystemExit("engineering closure head changed; no repository code executed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("sha=" + sha + "\n")
          print("Exact-head engineering closure admitted; NOT_CERTIFIED")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        # The build probes the bundled Playwright driver, not a Chromium browser.
        run: python -m pip install -r requirements.txt
      - name: Prepare digest-pinned standalone Python
        run: |
          python scripts/prepare_standalone_runtime.py "$RUNNER_TEMP/jae-standalone"
          echo "JAE_STANDALONE_RUNTIME=$RUNNER_TEMP/jae-standalone/python" >> "$GITHUB_ENV"
      - name: Build unsigned exact-head engineering Mac app
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python scripts/build_macos_app.py --standalone-runtime "$JAE_STANDALONE_RUNTIME" --output "$RUNNER_TEMP/jae-unsigned-distribution"
      - name: Retain exact-head unsigned engineering artifact NOT_CERTIFIED
        uses: actions/upload-artifact@v4
        with:
          name: jae-engineering-NOT_CERTIFIED-${{ needs.test.outputs.closure_head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jae-unsigned-distribution/AIApplicationManager-unsigned.tar.gz
            ${{ runner.temp }}/jae-unsigned-distribution/distribution-manifest.json
          if-no-files-found: error
          retention-days: 7
