name: Application Executor CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Deterministic task, privacy and no-submit contract
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr01_contract.py tests/test_jcr01_privacy.py -k 'not city_select'
      - name: Targeted independent review browser oracle
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q tests/test_jcr07_review_certificate.py tests/test_jcr01_synthetic_oracle.py tests/test_jcr06_react_fixture.py tests/test_jcr06_vue_fixture.py
      - name: Compile Python sources
        run: python -m compileall -q executor tests
      - name: Diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Full round-closure test suite
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q executor tests
