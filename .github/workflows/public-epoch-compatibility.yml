name: Public empty-form observer compatibility

on:
  push:
    branches: [test/jae-public-epoch-compatibility]

permissions:
  contents: read

jobs:
  public_empty_form_compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned diagnostic dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify finite no-authority probe contract
        run: python -m pytest -q tests/test_public_change_epoch_probe_v1.py tests/test_preparation_change_epoch_v1.py
      - name: Observe the public empty form without applicant material
        timeout-minutes: 2
        run: python scripts/probe_qiyunfang_change_epoch.py --output "$RUNNER_TEMP/jae-public-epoch.json"
      - name: Preserve only the finite compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jae-public-epoch-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jae-public-epoch.json
          if-no-files-found: error
          retention-days: 3
