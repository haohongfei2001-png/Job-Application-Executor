name: Bounded preparation research

on:
  push:
    branches: [test/jae-preparation-research]

permissions:
  contents: read

jobs:
  preparation_validation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify focused workflow scope
        run: |
          python3 -m unittest discover -s tests -p test_preparation_research_workflow_v1.py
          python3 -m unittest discover -s tests -p test_engineering_closure_workflow_v1.py
      - name: Install pinned preparation test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Observe public Qiyunfang preflight without applicant data
        timeout-minutes: 2
        run: python scripts/probe_qiyunfang_preflight.py --output "$RUNNER_TEMP/jae-qiyunfang-public-preflight.json"
      - name: Retain value-free public preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jae-qiyunfang-public-preflight-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jae-qiyunfang-public-preflight.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Focused popup and exact-request regression checks
        env:
          APPLICATION_EXECUTOR_BROWSER_MODE: isolated
          JAE_UI_SCREENSHOT_DIR: ${{ runner.temp }}/jae-preparation-ui
        run: python -m pytest -q -s tests/test_qiyunfang_preparation_v1.py tests/test_preparation_public_reads_v1.py tests/test_preparation_discovery_v1.py tests/test_preparation_preflight_v1.py tests/test_preparation_authority_v1.py tests/test_preparation_final_journal_v1.py tests/test_preparation_process_identity_v1.py tests/test_preparation_process_identity_browser.py tests/test_preparation_authority_browser.py tests/test_preparation_flow_v1.py tests/test_preparation_flow_browser.py tests/test_qiyunfang_preparation_browser.py tests/test_preparation_human_request_v1.py tests/test_preparation_human_request_browser.py tests/test_preparation_network_fence_v1.py
